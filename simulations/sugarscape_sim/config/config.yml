# FILE: simulations/sugarscape_sim/config/config.yml

# A unique identifier for this simulation type
simulation_package: "simulations.sugarscape_sim"

# Core simulation settings
simulation:
  steps: 1000
  log_directory: "data/logs/sugarscape_sim"
  random_seed: 42
  # NEW: Flags to control experimental conditions
  reward_shaping_enabled: true
  learning_phase_survival_only: true

# Environment-specific parameters
environment:
  class: "simulations.sugarscape_sim.environment.SugarscapeEnvironment"
  params:
    width: 50
    height: 50
    initial_sugar_distribution: "gaussian"
    sugar_regeneration_rate: 0.8 # CHANGED: Reduced from 1 to create scarcity
    max_sugar_per_cell: 4

# Agent foundational settings
agent:
  foundational:
    num_agents: 50
    lifespan_std_dev_percent: 0.1 # Not used in this model, but required by schema
    vitals:
      initial_time_budget: 9999 # Agents die from energy loss, not time
      initial_health: 100.0 # Not used, but required by schema
      initial_resources: 0 # Not used, but required by schema
    attributes:
      initial_attack_power: 0.0 # Not used, but required by schema
      initial_speed: 1 # Not used, but required by schema
  # Other sections required by the base config schema
  cognitive:
    embeddings: { identity_dim: 128, main_embedding_dim: 128, schema_embedding_dim: 128 }
    architecture_flags: {}
  costs:
    actions: {}
  dynamics:
    decay: {}
    regeneration: {}
    growth: {}
  emotional_dynamics:
    temporal: {}
    appraisal_weights: {}
  identity_dynamics: {}

# Learning parameters for the Q-learning agent
learning:
  q_learning:
    alpha: 0.1
    gamma: 0.95
    initial_epsilon: 1.0
    epsilon_decay_rate: 0.999
    min_epsilon: 0.05
  memory:
    reflection_interval: 100 # How often cognitive systems might run

# Paths to the provider and loader classes
scenario_loader:
  class: "simulations.sugarscape_sim.loader.SugarscapeScenarioLoader"
action_generator:
  class: "simulations.sugarscape_sim.providers.SugarscapeActionGenerator"
decision_selector:
  class: "simulations.sugarscape_sim.providers.HeuristicDecisionSelector"
component_factory:
  class: "simulations.sugarscape_sim.providers.SugarscapeComponentFactory"

# List of world-specific systems to load
systems:
  - "simulations.sugarscape_sim.systems.MetabolismSystem"
  - "simulations.sugarscape_sim.systems.MovementSystem"
  - "simulations.sugarscape_sim.systems.HarvestSystem"
  - "simulations.sugarscape_sim.systems.SocialSystem"
  - "simulations.sugarscape_sim.systems.RenderingSystem"

# Path to the module containing the action definitions
actions:
  - "simulations.sugarscape_sim.actions"

# Components to log to the database each tick
logging:
  components_to_log:
    - "simulations.sugarscape_sim.components.PositionComponent"
    - "simulations.sugarscape_sim.components.EnergyComponent"
    - "simulations.sugarscape_sim.components.MetabolismComponent"

rendering:
  enabled: true
  output_directory: "data/gif_renders/sugarscape_sim"
  frames_per_second: 15
  pixel_scale: 10
