# FILE: simulations/sugarscape_sim/experiments/validate_sim.yml

experiment_name: "Sugarscape - Cognitive Strategy Analysis"

# Path to the base configuration file for this simulation.
base_config_path: "simulations/sugarscape_sim/config/config.yml"

# The Python package for the Sugarscape simulation.
simulation_package: "simulations.sugarscape_sim"

# The scenario file defining the world's initial state.
scenarios:
  - "simulations/sugarscape_sim/scenarios/default.json"

# Number of times to run each variation for statistical significance.
runs_per_scenario: 30

# Define the four experimental groups for our study.
variations:
  - name: "GroupA-Revised-Heuristic"
    overrides:
      decision_selector:
        # A more realistic baseline that still uses rules but must explore.
        class: "simulations.sugarscape_sim.providers.ExplorationHeuristicDecisionSelector"

  - name: "GroupB-QLearning-NoShaping"
    overrides:
      decision_selector:
        class: "simulations.sugarscape_sim.providers.QLearningDecisionSelector"
      simulation:
        # Control group: learning agent without reward shaping.
        reward_shaping_enabled: false
        learning_phase_survival_only: true # Still simplify the action space

  - name: "GroupC-QLearning-WithShaping"
    overrides:
      decision_selector:
        class: "simulations.sugarscape_sim.providers.QLearningDecisionSelector"
      simulation:
        # Experimental group: our improved learning agent.
        reward_shaping_enabled: true
        learning_phase_survival_only: true

  - name: "GroupD-Random-Walker"
    overrides:
      decision_selector:
        # Null hypothesis baseline: performs random actions.
        class: "simulations.sugarscape_sim.providers.RandomDecisionSelector"
